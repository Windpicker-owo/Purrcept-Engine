# 只借用仓内冻结依赖和公开索引，不要求开发机同级仓库。
name: Engine 离线验收

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: uv sync --locked --all-groups --all-extras
      - run: uv run --no-sync python frontend/node_modules/@purrcept/cel/scripts/lint_styles.py frontend/src frontend/index.html
      - run: uv run --no-sync python -m pytest -q
      - run: uv run --no-sync ruff check src tests examples scripts
      - run: uv run --no-sync ruff format --check src tests examples scripts
      - run: uv run --no-sync pyright
      - run: uv run --no-sync python -m compileall -q src tests examples scripts
      - run: uv build --no-sources
      - name: 独立安装并验证真实 Worker 与持久化
        shell: pwsh
        run: |
          uv venv --python 3.12 build/ci-install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python build/ci-install/Scripts/python.exe --find-links vendor 'dist/purrcept_engine-0.1.0-py3-none-any.whl[web,qq,time,browser,voice-input,live2d]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip check --python build/ci-install/Scripts/python.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          build/ci-install/Scripts/python.exe -I -X utf8 scripts/verify_installation.py
