# ============================================================================
# Purrcept Engine 配置文件模板 (purrcept.toml)
#
# 三步快速跑通：
#   1. 修改下方 [models.main] 的 api_base、model 与 api_key
#      - 支持读取环境变量，例如：api_key = "${OPENAI_API_KEY}"
#      - 本机或局域网免密服务（如 Ollama / vLLM / LM Studio）可将 api_key 留空 ""
#   2. 校验配置：uv run purrcept-engine check
#   3. 启动运行：uv run purrcept-engine run
#
# 查看全部内置插件字段说明：uv run purrcept-engine plugins
# ============================================================================

# 开启终端对话输入：启动后直接在终端打字回车即可作为刺激发给主体。
# 注意：主体的内部思考文字不会自动打印为回复，她通过调用 me.console.output 主动说话。
console = true

[host]
# 运行数据、SQLite 数据库与日志目录（相对本配置文件所在目录解析）
data_dir = ".purrcept-engine"

[web]
# 安装 Web 面板依赖（uv sync --extra web）后改为 true，启动会输出 http://127.0.0.1:8765 访问地址
enabled = false
port = 8765

[logging]
# 终端与文件日志级别：DEBUG / INFO / WARNING / ERROR（也可在启动时加 --debug 临时开启）
level = "INFO"

# ----------------------------------------------------------------------------
# 1. 模型连接配置
#    只需配置一个 OpenAI 兼容生成模型即可同时驱动主脑、反思与注意判断。
# ----------------------------------------------------------------------------
[models.main]
# 模型名称须保留 "openai/" 协议前缀，后接服务端真实的模型 ID
# 例如："openai/deepseek-chat"、"openai/qwen-plus"、"openai/gpt-4o"、"openai/qwen2.5:14b"
model = "openai/replace-with-your-model"

# OpenAI 兼容接口地址（通常以 /v1 结尾；Ollama 本地默认填 "http://127.0.0.1:11434/v1"）
api_base = "http://127.0.0.1:11434/v1"

# 接口凭据：云端服务可填 "${OPENAI_API_KEY}" 或明文密钥；本机/局域网免密服务可直接留空 ""
api_key = ""

# 模型实际上下文窗口与单次最大输出 Token 数（须满足 max_output_tokens < context_window）
context_window = 64000
max_output_tokens = 4096

# 模型原生支持的多模态输入类型：默认 ["text"]，按服务端能力可加 "image"、"audio"
supports_contents = ["text"]

# ----------------------------------------------------------------------------
# 2. 主体与角色设定
# ----------------------------------------------------------------------------
[subject]
foreground = "main"          # 主脑连续对话与行动使用的模型名
reflection = "main"          # 后台行为复盘使用的模型名（省略时默认同 foreground）
attention = "main"           # 收件箱注意评估使用的模型名（设为单模型即可开箱即用）
proactive_thinking = false   # 空闲满 proactive_idle_seconds 秒后是否主动唤醒思考一次（会消耗 Token）
proactive_idle_seconds = 300.0

[subject.character]
name = "小咕"
one_line = "住在你电脑里的连续在线 AI 伙伴。"
persona = "好奇心强、做事利落，遇到不确定的事会先观察或查笔记，不装腔作势。"
relationship = "日常陪伴与协作伙伴。"
speech_style = "用自然、简短的中文交流，像熟人聊天一样直接。"
notes = ""


# ============================================================================
# 3. 常用内置插件示例（按需取消注释即可启用，无需改动文件顶部）
#    随时可运行 `uv run purrcept-engine plugins <插件名>` 查看完整字段与默认值
# ============================================================================

# --- [插件 1] Notebook：随身日记、长期记忆与技能目录（强烈推荐开启） ---
# [[plugins]]
# instance_id = "notebook"
# entry = "notebook"
# enabled = true
# [plugins.config]
# notebook_dir = "notes"       # 笔记存放目录（相对本配置文件目录）
# skills_dir = "skills"        # 技能目录（相对 notebook_dir，即 notes/skills）
# seed_examples = true         # 首次启动写入示例笔记与睡眠技能说明
# # 可选：后台自动将零散笔记整理为专题记忆页
# # [plugins.config.consolidation]
# # enabled = true
# # model = "main"
# # 可选：接入 Embedding 模型开启语义 + 关键词混合检索（不配则使用内置 FTS5 关键词检索）
# # [plugins.config.embedding]
# # model = "openai/text-embedding-3-small"
# # model_id = "embedding-v1"
# # api_base = "https://api.openai.com/v1"
# # api_key = "${OPENAI_API_KEY}"

