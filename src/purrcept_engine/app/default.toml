# Purrcept Engine 零可选插件配置模板。默认看图由宿主装配，校验不读取图像或连接端点。
# 以下模型名、窗口和凭据为占位值，使用前应替换为已核对的实际配置。
# 生成请求使用 LiteLLM 本地 token 估计，专用判断保留文本字节参考。
# Gemini 3 原声输入可配置 media_rule = "gemini-3-inline-v1"，并在下面声明 audio。
# 该媒体规则覆盖内联单帧图片与 WAV/MP3；不是其他模型或远端媒体的通用公式。
console = false
plugins = []

[web]
enabled = false
port = 8765

[host]
data_dir = ".purrcept-engine"
close_seconds = 30.0

[logging]
retention_days = 7
max_bytes = 10485760
max_files = 7

[diagnostics]
retention_days = 7
max_bytes = 1048576

[models.foreground]
kind = "generation"
model = "openai/replace-with-local-generation-model"
api_base = "http://127.0.0.1:4000/v1"
api_key = "replace-with-explicit-local-key"
context_window = 32000
max_output_tokens = 4096
capacity_rule = "litellm-token-counter-v1"
media_rule = "unsupported"
supports_contents = ["text"] # 可按实际支持情况添加 image、audio、video。

[models.attention]
# OpenRouter Jev 可使用 openrouter/typesafe/jev-1.13，api_base 为
# https://openrouter.ai/api；SDK 追加 /alpha/decisions，不使用聊天接口 /v1。
kind = "decision"
model = "typesafe/replace-with-decision-model"
api_base = "http://127.0.0.1:4001/v1"
api_key = "replace-with-explicit-decision-key"
input_limit = 8192
capacity_rule = "reference-text-only-v1"
media_rule = "unsupported"
supports_contents = ["text"] # decision 协议当前最多交付 text、image。

[subject]
foreground = "foreground"
reflection = "foreground"
summary = "foreground"
attention = "attention"
attention_batch_seconds = 0.1
attention_batch_size = 8
proactive_thinking = false # 启动默认值；WebUI 可在本次运行中切换。
proactive_idle_seconds = 300.0 # 无新刺激且前台空闲后，等待此间隔再触发一次。
reflection_batch_seconds = 60.0
reflection_batch_turns = 8

# 六项固定身份缺省为 None；配置需要的字符串，不从认识或人员权限恢复。
[subject.character]

[subject.foreground_retry]
attempts = 2
attempt_seconds = 120.0
total_seconds = 180.0

[subject.attention_retry]
attempts = 2
attempt_seconds = 5.0
total_seconds = 8.0

[subject.foreground_turn]
max_requests = 8
total_seconds = 600.0

[context]
summary_trigger = 0.8
summary_target = 0.5
input_reserve_fraction = 0.1
protected_turns = 2
page_chars = 8000

[execution]
action_seconds = 180.0
worker_cpu_seconds = 15.0
worker_memory_bytes = 536870912
max_calls = 64
source_bytes = 65536
output_bytes = 65536
result_bytes = 1048576
call_arguments_bytes = 1048576
call_result_bytes = 1048576
frame_bytes = 2097152
max_workers = 4
max_provider_calls = 16
max_pending_inputs = 1024
pending_input_bytes = 268435456

[activities]
max_active = 8
initial_seconds = 3600.0
max_remaining_seconds = 3600.0
checkpoint_seconds = 5.0

# 启用 Notebook 时改写顶层 plugins=[] 为下列数组项（不可同时保留两种定义）。
