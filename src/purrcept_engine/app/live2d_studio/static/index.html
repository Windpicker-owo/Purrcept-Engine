<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live2D 表演调节室</title><link rel="stylesheet" href="/assets/studio.css"></head>
<body><header><div><p class="eyebrow">PURRCEPT · LIVE2D</p><h1>让角色有自己的姿态</h1><p>在 VTube Studio 中观察变化，为当前模型保存表演偏好。</p></div><span id="connection">正在读取</span></header>
<main><aside><h2>现场预览</h2><p>请先停止其他控制器的 VTS 输出，避免两套动作同时生效。</p><div class="buttons"><button id="connect">连接 VTS</button><button id="disconnect" class="secondary">断开</button></div><hr><h3>同一段声音，比较不同嘴型</h3><p>使用启动时指定的本地短语音，不调用在线合成。</p><button id="audio">播放测试语音</button><button id="stop" class="secondary">停止播放</button><hr><p id="model"></p><p id="notice" role="status" aria-live="polite">滑块自动预览，保存后才写入偏好。</p><p class="hint">新版本正式控制器约一秒内读取保存结果。正在运行的旧版本须先重启。</p></aside>
<article><div class="toolbar"><span id="dirty">已载入保存值</span><div class="buttons"><button id="reload" class="secondary">重新载入</button><button id="reset" class="secondary">默认值</button><button id="save">保存偏好</button></div></div><div id="controls"></div><p class="hint">嘴部横向形态取决于模型的 mouth_form 绑定。仅音量驱动不能还原逐字音素；这里调整幅度与表情，不伪造音素识别。</p></article></main><script src="/assets/studio.js"></script></body></html>
