[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "purrcept_engine"
version = "0.1.0"
description = "Purrcept 的连续主体宿主与显式执行引擎。"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "av==16.1.0",
  "httpx==0.28.1",
  "litellm==1.105.0",
  "openai==2.49.0",
  "pillow==12.3.0",
  "purrcept_core>=0.6.0,<0.7",
  "purrcept_litellm>=0.2.1,<0.3",
  "pydantic==2.13.4",
]

[project.optional-dependencies]
qq = ["websockets==15.0.1"]
time = ["tzdata==2026.5"]
browser = ["patchright>=1.50,<2", "trafilatura>=2,<3"]
web = ["starlette==0.49.3", "uvicorn==0.39.0"]
voice-input = [
  "numpy==2.5.1",
  "sounddevice==0.5.6",
  "onnxruntime==1.30.0",
  "websockets==15.0.1",
]
live2d = ["websockets==15.0.1"]

[project.scripts]
purrcept-engine = "purrcept_engine.app.cli:main"
purrcept-voice-studio = "purrcept_engine.app.studio.cli:main"

[dependency-groups]
dev = [
  "build==1.6.0",
  "hatchling==1.32.4",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.0",
]

[tool.uv.sources]
purrcept-litellm = { path = "vendor/purrcept_litellm-0.2.1-py3-none-any.whl" }

[tool.uv]
environments = ["sys_platform == 'win32'"]

[tool.hatch.build.targets.wheel]
packages = ["src/purrcept_engine"]

[tool.hatch.build.targets.sdist]
# 明确发行输入，避免扫描工作区历史临时库或把开发依赖带入源码包。
only-include = [
  "src", "frontend", "scripts", "tests", "examples", "docs", "vendor", "assets",
  ".github", "README.md", "CONTRIBUTING.md", "AGENTS.md", "uv.lock",
]

[tool.hatch.build]
exclude = [
  "/plugins",
  "/build",
  "/dist",
  "/purrcept.toml",
  "/.venv",
  "/.validation",
  "/.pytest_cache",
  "/.ruff_cache",
  "/frontend/node_modules",
  "/frontend/.test-tmp",
  "**/__pycache__",
  "**/*.pyc",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "UP"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests", "examples"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnnecessaryIsInstance = false
