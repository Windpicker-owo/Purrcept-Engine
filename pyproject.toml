[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "purrcept_engine"
version = "0.1.0"
description = "Purrcept 的连续主体宿主与显式执行引擎。"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "purrcept_core>=0.6.0,<0.7",
  "purrcept_litellm>=0.2.0,<0.3",
  "pydantic>=2.12,<3",
]

[project.scripts]
purrcept-engine = "purrcept_engine.app.cli:main"

[dependency-groups]
dev = [
  "build>=1.2.2",
  "httpx>=0.27,<0.29",
  "pyright>=1.1.390",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.9",
]

[tool.uv.sources]
purrcept_core = { path = "../purrcept_core", editable = true }
purrcept_litellm = { path = "../purrcept_litellm", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/purrcept_engine"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "UP"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "tests", "examples"]
extraPaths = ["src", "../purrcept_core/src", "../purrcept_litellm/src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnnecessaryIsInstance = false
