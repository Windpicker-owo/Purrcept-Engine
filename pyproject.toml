[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "purrcept_engine"
version = "0.1.0"
description = "Purrcept 的连续主体宿主与显式执行引擎。"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx==0.28.1",
  "litellm==1.105.0+purrcept.1",
  "openai==2.49.0",
  "purrcept_core>=0.6.0,<0.7",
  "purrcept_litellm>=0.2.0,<0.3",
  "pydantic==2.13.4",
]

[project.optional-dependencies]
qq = ["websockets==15.0.1"]
time = ["tzdata==2026.5"]
computer = ["pillow>=11,<13"]
browser = ["patchright>=1.50,<2", "trafilatura>=2,<3", "pillow>=11,<13"]
web = ["starlette==0.49.3", "uvicorn==0.39.0"]

[project.scripts]
purrcept-engine = "purrcept_engine.app.cli:main"

[dependency-groups]
dev = [
  "build==1.6.0",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.0",
]

[tool.uv.sources]
litellm = { path = "build/litellm-patched/litellm-1.105.0+purrcept.1-cp310-abi3-win_amd64.whl" }
purrcept_core = { path = "../purrcept_core", editable = true }
purrcept_litellm = { path = "../purrcept_litellm", editable = true }

[tool.uv]
environments = ["sys_platform == 'win32'"]

[tool.hatch.build.targets.wheel]
packages = ["src/purrcept_engine"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "UP"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "tests", "examples"]
extraPaths = ["src", "../purrcept_core/src", "../purrcept_litellm/src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnnecessaryIsInstance = false
